<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Registration | LifeDrop</title>

    <link rel="stylesheet" href="donor.css">
</head>

<body>

    <!-- HEADER -->

    <header class="register-header">

        <a href="../index.html" class="logo">
            <span class="logo-icon">♥</span>
            LifeDrop
        </a>

        <a href="../index.html" class="back-link">
            ← Back to Home
        </a>

    </header>


    <!-- REGISTRATION PAGE -->

    <main class="register-container">

        <div class="register-heading">

            <span class="form-tag">JOIN OUR COMMUNITY</span>

            <h1>Become a <span>Blood Donor</span></h1>

            <p>
                Your willingness to donate can make a meaningful
                difference in someone's life.
            </p>

        </div>


        <!-- FORM -->

        <form id="donorForm" class="donor-form">

            <h2>Personal Information</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName"
                        placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age"
                        placeholder="Enter your age"
                        min="18" max="65" required>
                </div>

                <div class="form-group">
                    <label for="bloodGroup">Blood Group</label>

                    <select id="bloodGroup" required>
                        <option value="">Select Blood Group</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone"
                        placeholder="10-digit mobile number"
                        pattern="[0-9]{10}" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                        placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city"
                        placeholder="Enter your city" required>
                </div>

            </div>

            <div class="form-group">
                <label for="address">Full Address</label>
                <textarea id="address"
                    placeholder="Enter your address"
                    rows="3" required></textarea>
            </div>

            <button type="submit" class="register-btn">
                Submit Registration →
            </button>

            <p class="form-note">
                Submitting this form does not confirm donor eligibility.
                Medical screening is required before donation.
            </p>

        </form>

    </main>


    <script src="donor.js"></script>

</body>
</html>
