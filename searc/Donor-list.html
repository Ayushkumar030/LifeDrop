
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeDrop - Donor List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        h1 {
            color: darkred;
            text-align: center;ś
        }

        input {
            padding: 10px;
            width: 250px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: darkred;
            color: white;
        }

        button {
            background: darkred;
            color: white;
            padding: 7px 12px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>LifeDrop - Donor List</h1>

    <input type="text" id="search"
        placeholder="Search by name or blood group">

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Blood Group</th>
                <th>Phone</th>
                <th>City</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="donorTable"></tbody>
    </table>

    <script>
        
let donors = JSON.parse(localStorage.getItem("donors")) || [];

function displayDonors(data) {

    const table = document.getElementById("donorTable");

    table.innerHTML = "";

    data.forEach((donor) => {

        let index = donors.indexOf(donor);

        table.innerHTML += `
            <tr>
                <td>${donor.name}</td>
                <td>${donor.age}</td>
                <td>${donor.bloodGroup}</td>
                <td>${donor.phone}</td>
                <td>${donor.city}</td>
                <td>
                    <button onclick="deleteDonor(${index})">
                        Delete
                    </button>
                </td>
            </tr>
        `;
    });
}

function deleteDonor(index) {

    if (confirm("Are you sure you want to delete?")) {

        donors.splice(index, 1);

        localStorage.setItem("donors", JSON.stringify(donors));

        displayDonors(donors);
    }
}

document.getElementById("search").addEventListener("input", function () {

    let value = this.value.toLowerCase();

    let filtered = donors.filter(donor =>
        donor.name.toLowerCase().includes(value) ||
        donor.bloodGroup.toLowerCase().includes(value)
    );

    displayDonors(filtered);
});

displayDonors(donors);

    </script>

</body>
</html>
